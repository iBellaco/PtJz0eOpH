name: Diagnose installed draft selection
on:
  push:
    branches: [pruebas]
    paths: [.github/workflows/draft-selection-diagnostic.yml, tools/check-draft-selection-device.py]
permissions:
  contents: read
jobs:
  installed-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download current published APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          curl --fail --location --retry 3 --output app/build/outputs/apk/debug/app-debug.apk https://github.com/iBellaco/PtJz0eOpH/releases/download/v1.1.10.164-b880/Coach-v1.1.10.164-build-880-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 tools/check-draft-selection-device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-selection-diagnostic
          path: app/build/reports/portuguese-device/
          retention-days: 7
