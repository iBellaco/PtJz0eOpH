name: Validación selectiva de correcciones de Coach
run-name: Validación unificada de fix-error · ${{ github.sha }}

on:
  push:
    branches: [fix-error]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Alcance de la validación dirigida (auto detecta los archivos modificados)
        type: choice
        options:
          - auto
          - full
          - scanner
          - ui
          - sponsors
          - docs
        default: auto
        required: true
      scanner_regressions:
        description: Ejecutar también las regresiones OCR instaladas (opcional y lento)
        type: boolean
        default: false
      spanish_only:
        description: Recompilar y comprobar geometría y la suite instalada en español pendiente
        type: boolean
        default: false
      native_sequence_shard:
        description: Repetir únicamente un shard nativo fallido (por ejemplo 10)
        type: string
        required: false
        default: ''
      native_sequence_source_run:
        description: Ejecución validada que contiene scanner-multidevice-audit para reconstruir el shard
        type: string
        required: false
        default: ''

concurrency:
  group: coach-fix-error-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  validation-scope:
    name: Detectar alcance seguro de la corrección
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      run_draft: ${{ steps.scope.outputs.run_draft }}
      run_sponsor: ${{ steps.scope.outputs.run_sponsor }}
      run_release: ${{ steps.scope.outputs.run_release }}
      run_native: ${{ steps.scope.outputs.run_native }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Clasificar archivos modificados sin consultar ejecuciones externas
        id: scope
        env:
          COACH_VALIDATION_SCOPE: ${{ inputs.validation_scope || 'auto' }}
          COACH_SCANNER_REGRESSIONS: ${{ inputs.scanner_regressions || 'false' }}
          COACH_SPANISH_ONLY: ${{ inputs.spanish_only || 'false' }}
          COACH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/detect-validation-scope.py
      - name: Mostrar alcance seleccionado
        run: |
          {
            echo "### Alcance de fix-error"
            echo "Se ejecutan únicamente las suites afectadas; la validación completa sigue reservada para coach-validacion."
            echo "Alcance: ${{ steps.scope.outputs.scope }}"
            echo "Draft/interfaz: ${{ steps.scope.outputs.run_draft }}"
            echo "Patrocinadores/economía: ${{ steps.scope.outputs.run_sponsor }}"
            echo "APK instalado: ${{ steps.scope.outputs.run_release }}"
            echo "Secuencia nativa: ${{ steps.scope.outputs.run_native }}"
          } >> "$GITHUB_STEP_SUMMARY"

  catalog-preflight:
    # Keep the mandatory preflight in the graph even when an upstream job
    # exposes outputs for selective suites.  The explicit success check still
    # prevents running it after a failed scope calculation, while avoiding a
    # silent skipped job that can mark the workflow red without diagnostics.
    if: ${{ always() && needs.validation-scope.result == 'success' }}
    needs: validation-scope
    name: Comprobaciones previas de catálogos, idiomas y planes de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Ejecutar las mismas comprobaciones previas de validación
      run: |
        python3 -m pip install --quiet PyYAML==6.0.3
        python3 -m unittest discover -s .github/scripts -p test_parallel_validation.py
        python3 -m unittest discover -s .github/scripts -p test_validated_apk.py
        python3 -m unittest discover -s tools -p test_emulator_image.py
        python3 -m unittest discover -s tools -p test_draft_rival_device.py
        python3 -m unittest discover -s tools -p test_account_deletion_device.py
        python3 -m unittest discover -s .github/scripts -p test_localized_resources.py
        python3 -m unittest discover -s .github/scripts -p test_session_dialog.py
        python3 -m unittest discover -s .github/scripts -p test_no_realtime_cooldown_tracker.py
        python3 -m unittest discover -s .github/scripts -p test_validation_scope.py
        python3 .github/scripts/validate-localized-resources.py
        python3 .github/scripts/validate-patch-content.py
        python3 -m unittest discover -s .github/scripts -p test_patch_content.py
        python3 -m unittest discover -s tools -p test_draft_audit_retry.py
        python3 -m unittest discover -s tools -p test_scanner_device_report.py
        python3 -m unittest discover -s tools -p test_scanner_audit_summary.py
        python3 -m unittest discover -s tools -p test_scanner_sequence_audit.py
        python3 -m unittest discover -s tools -p test_scanner_sequence_stream.py
        python3 -m unittest discover -s tools -p test_scanner_request_coverage.py
        python3 -m unittest discover -s tools -p test_junit_failure_report.py
        python3 tools/generate-component-items.py --check
        python3 tools/import-component-icons.py --check
        python3 tools/update-champion-builds.py --check
        bash tools/audit-portuguese.sh

  targeted-last-pick:
    if: needs.validation-scope.outputs.run_draft == 'true'
    needs: [validation-scope, catalog-preflight]
    name: Roles, primera selección, baneos y catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código de fix-error
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Preparar configuración local de pruebas
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          cp .env app/.env 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('app/google-services.json').write_text(json.dumps({
              'project_info': {'project_number': '1234567890', 'project_id': 'coach-fix-error-local'},
              'client': [{'client_info': {
                  'mobilesdk_app_id': '1:1234567890:android:0000000000000000',
                  'android_client_info': {'package_name': 'com.Coach'}},
                  'api_key': [{'current_key': 'local-targeted-ocr-test-only'}]}],
              'configuration_version': '1'
          }) + '\n')
          PY

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1


      - name: Validar recursos de los dos idiomas
        run: python3 .github/scripts/validate-localized-resources.py

      - name: Probar cambio de retrato, estabilidad, cierre y regresiones del Hub
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from importlib.machinery import SourceFileLoader
          runner = SourceFileLoader('regression', 'tools/run-jvm-regression.py').load_module()
          runner.verify([
              'com.example.DraftMultideviceBoxesTest',
              'com.example.CaptureFrameDecoderTest',
              'com.example.DraftGeometryPreviewTest',
              'com.example.DraftGeometryStabilityTest',
              'com.example.DraftPreviewAlignmentTest',
              'com.example.CaptureCoordinateSpaceTest',
              'com.example.PocoDebugCaptionLayoutTest',
              'com.example.DraftRingAlignmentTest',
              'com.example.DraftNativeSceneTest',
              'com.example.SecurityPrioritiesTest',
              'com.example.PersonalBackupRoundTripTest',
              'com.example.RequiredVersionRegressionTest',
              'com.example.DraftAutoStopTest',
              'com.example.TenthPickRegressionTest',
              'com.example.EnemyRoleInferenceTest',
              'com.example.DraftOrderUiTest',
              'com.example.DraftBanWorkerTest',
              'com.example.BannedPortraitScannerTest',
              'com.example.PortraitMatcherTest',
              'com.example.CatalogBalanceTest',
              'com.example.WildRiftItemsCatalogTest',
              'com.example.PortugueseGeneratedSurfaceTest',
              'com.example.RequiredItemCorrectionsTest',
              'com.example.ChampionBuildsCatalogValidationTest',
              'com.example.BuildCoachingRegressionTest',
              'com.example.DraftSlotLifecycleTest',
              'com.example.DraftSlotVisibilityTest',
              'com.example.SponsorReviewPolicyTest',
              'com.example.EconomyRequestPolicyTest',
              'com.example.AppReliabilityTest',
              'com.example.SponsorSubmissionStoreTest',
              'com.example.SponsorPendingStateTest',
              'com.example.InboxSynchronizationTest',
              'com.example.CoachingGeneratorLocalizationTest',
              'com.example.RuntimeBehaviorTest',
          ])
          PY

      - name: Conservar resultados del arreglo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-draft-catalog-evidence
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/portuguese-rendered/
          if-no-files-found: warn
          retention-days: 14

      - name: Reproducir centros desplazados y baneo en captura reducida
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.example.DraftMultiDeviceAuditTest.smallCapturePreservesJhinWhenPortraitsAndBansChange' \
            --tests 'com.example.DraftMultiDeviceAuditTest.formerlyFailingCentersStayAlignedWhenPortraitsChange' \
            --tests 'com.example.data.OverlayAccessSnapshotTest' \
            --tests 'com.example.PasswordPolicyTest' \
            --tests 'com.example.PatchTierMovementTest' \
            --tests 'com.example.TierMovementRegressionTest' \
            --tests 'com.example.CoachRoutineRegressionTest' \
            --tests 'com.example.LiteRTViewerNavigationTest' \
            --tests 'com.example.service.FloatingWindowLifecycleTest' \
            --tests 'com.example.DraftGeometryStabilityTest' \
            --tests 'com.example.DraftAutoStopTest' \
            --tests 'com.example.DraftSessionLifecycleTest' \
            --stacktrace --no-daemon --max-workers=1

      - name: Conservar la regresión de la captura reducida
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-small-capture-evidence
          path: |
            app/build/test-results/testDebugUnitTest/TEST-com.example.DraftMultiDeviceAuditTest.xml
            app/build/reports/scanner-multidevice/
          if-no-files-found: warn
          retention-days: 14

  sponsor-permissions:
    if: needs.validation-scope.outputs.run_sponsor == 'true' && !inputs.spanish_only
    needs: [validation-scope, catalog-preflight]
    name: Solicitudes, esencias y moderación con las reglas reales
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/economy/package-lock.json
            tests/firestore/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
        working-directory: tests/firestore
      - run: npm ci --no-audit --no-fund
        working-directory: server/economy
      - run: node --test server/economy/test/*.test.mjs
      - name: Comprobar envíos, moderación e idempotencia en emulador aislado
        working-directory: tests/firestore
        run: npx firebase emulators:exec --only firestore,auth --project demo-coach-tests --config ../../firebase.json 'node rules.test.mjs && node economy-submission.test.mjs && node sponsor-review.test.mjs && node ../../server/economy/test/emulator.integration.mjs'

  shared-release-apks:
    if: needs.validation-scope.outputs.run_release == 'true'
    needs: [validation-scope, catalog-preflight]
    name: Compilar APK release una vez para todas las pruebas instaladas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - &fix-release-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - &fix-release-local-config
        name: Configurar Android SDK y cliente local de prueba
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          cp .env.example .env 2>/dev/null || touch .env
          cp .env app/.env 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('app/google-services.json').write_text(json.dumps({
              'project_info': {'project_number': '1234567890', 'project_id': 'coach-fix-error-local'},
              'client': [{'client_info': {
                  'mobilesdk_app_id': '1:1234567890:android:0000000000000000',
                  'android_client_info': {'package_name': 'com.Coach'}},
                  'api_key': [{'current_key': 'local-targeted-ocr-test-only'}]}],
              'configuration_version': '1'
          }) + '\n')
          PY
      - &fix-release-gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - &fix-release-sign
        name: Crear firma efímera solo para pruebas
        env:
          COACH_ALLOW_EPHEMERAL_TEST_SIGNING: 'true'
        run: python3 .github/scripts/restore-private-signing.py
      - name: Preparar todos los casos que bloquearon la validación completa
        run: |
          mkdir -p app/build/generated/scanner-sequence-assets
          cp app/src/test/resources/scanner/targeted-sequence-plan.json \
            app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
      - &fix-release-build
        name: Compilar los dos APK release con R8
        env:
          COACH_ALLOW_EPHEMERAL_TEST_SIGNING: 'true'
          COACH_SIGNING_KEY_ALIAS: androiddebugkey
          KEYSTORE_PATH: ${{ github.workspace }}/github.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleRelease -PcoachInstrumentedBuildType=release \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            --max-workers=1 --stacktrace --no-daemon -x lint -x lintVitalRelease
          ./gradlew :app:assembleReleaseAndroidTest -PcoachInstrumentedBuildType=release \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            --max-workers=1 --stacktrace --no-daemon -x lint -x lintVitalRelease
      - name: Compartir ambos APK de prueba con los emuladores
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-shared-release-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  targeted-red-magic-release:
    if: github.event_name == 'workflow_dispatch' && inputs.scanner_regressions && !inputs.spanish_only && needs.validation-scope.outputs.run_native == 'true'
    needs: [validation-scope, catalog-preflight, shared-release-apks]
    name: Errores conocidos en release (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: titulos-cortos
            preflight: 'true'
            targets: 'sequence-49-enemy-first,sequence-56-ally-first,sequence-63-enemy-first'
          - suite: redmagic-secuencia-completa
            preflight: 'false'
            targets: 'sequence-0-enemy-first'
          - suite: xiaomi-secuencia-completa
            preflight: 'false'
            targets: 'sequence-42-ally-first'
          - suite: espanol-instalado
            preflight: 'false'
            targets: ''
    steps:
      - uses: actions/checkout@v5
      - *fix-release-java
      - *fix-release-local-config
      - name: Recuperar los APK release compartidos
        uses: actions/download-artifact@v4
        with:
          name: fix-error-shared-release-apks
          path: app/build/outputs/apk/
      - name: Preparar el plan exacto de secuencias de prueba
        run: |
          mkdir -p app/build/generated/scanner-sequence-assets
          cp app/src/test/resources/scanner/targeted-sequence-plan.json app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
      - &fix-release-kvm
        name: Activar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
      - uses: ./.github/actions/prepare-emulator
      - name: Reproducir Red Magic y todos los errores OCR conocidos en release
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COACH_SEQUENCE_SHARD: '0'
          COACH_SEQUENCE_PREFLIGHT: ${{ matrix.preflight }}
          COACH_SEQUENCE_TARGETS: ${{ matrix.targets }}
          COACH_SEQUENCE_BUILD_TYPE: release
          COACH_ISOLATED_SUITE: ${{ matrix.suite }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            if [ "$COACH_ISOLATED_SUITE" = "espanol-instalado" ]; then for attempt in 1 2 3; do COACH_ACCOUNT_DELETION_ATTEMPT="$attempt" python3 tools/verify-account-deletion-device.py || exit 1; done; python3 tools/verify-draft-rival-names-device.py && COACH_AUDIT_LANGUAGE=es python3 tools/audit-portuguese-device.py && python3 tools/verify-overlay-history-device.py; fi
            if [ "$COACH_SEQUENCE_PREFLIGHT" = "true" ]; then python3 tools/verify-targeted-red-magic.py; fi
            /usr/bin/env bash -c 'overall_status=0; for target_case in ${COACH_SEQUENCE_TARGETS//,/ }; do if ! COACH_SEQUENCE_TARGETS="$target_case" python3 tools/verify-draft-sequence-device.py; then overall_status=1; fi; done; exit "$overall_status"'
      - name: Conservar evidencia release de todos los errores conocidos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-known-release-evidence-${{ matrix.suite }}
          path: |
            app/build/reports/scanner-sequence-preflight/
            app/build/reports/scanner-sequence/
            app/build/reports/spanish-device/
          if-no-files-found: warn
          retention-days: 14

  targeted-spanish-recheck:
    if: github.event_name == 'workflow_dispatch' && inputs.scanner_regressions && inputs.spanish_only && needs.validation-scope.outputs.run_native == 'true'
    needs: [validation-scope, catalog-preflight, shared-release-apks]
    name: Revisión instalada en español (corrección dirigida)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - *fix-release-java
      - *fix-release-local-config
      - name: Recuperar los APK release compartidos
        uses: actions/download-artifact@v4
        with:
          name: fix-error-shared-release-apks
          path: app/build/outputs/apk/
      - name: Preparar el plan exacto de secuencias de prueba
        run: |
          mkdir -p app/build/generated/scanner-sequence-assets
          cp app/src/test/resources/scanner/targeted-sequence-plan.json app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
      - *fix-release-kvm
      - uses: ./.github/actions/prepare-emulator
      - name: Reproducir únicamente la suite instalada en español
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COACH_SEQUENCE_SHARD: '0'
          COACH_SEQUENCE_PREFLIGHT: 'false'
          COACH_SEQUENCE_TARGETS: ''
          COACH_SEQUENCE_BUILD_TYPE: release
          COACH_ISOLATED_SUITE: espanol-instalado
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            for attempt in 1 2 3; do COACH_ACCOUNT_DELETION_ATTEMPT="$attempt" python3 tools/verify-account-deletion-device.py || exit 1; done
            python3 tools/verify-draft-rival-names-device.py
            COACH_AUDIT_LANGUAGE=es python3 tools/audit-portuguese-device.py
            python3 tools/verify-overlay-history-device.py
      - name: Conservar evidencia de la revisión española
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-spanish-recheck-evidence
          path: |
            app/build/reports/spanish-device/
            app/build/reports/scanner-sequence/
          if-no-files-found: warn
          retention-days: 14

  targeted-installed-vi:
    if: needs.validation-scope.outputs.run_native == 'true' && !inputs.spanish_only
    needs: [validation-scope, catalog-preflight, shared-release-apks]
    name: Regresión instalada de Vi y secuencia reducida
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - *fix-release-java
      - *fix-release-local-config
      - name: Recuperar los mismos APK release verificados
        uses: actions/download-artifact@v4
        with:
          name: fix-error-shared-release-apks
          path: app/build/outputs/apk/
      - name: Preparar el plan exacto de secuencias de prueba
        run: |
          mkdir -p app/build/generated/scanner-sequence-assets
          cp app/src/test/resources/scanner/targeted-sequence-plan.json app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
      - *fix-release-kvm
      - uses: ./.github/actions/prepare-emulator
      - name: Comprobar retratos y la secuencia exacta pendiente
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COACH_SEQUENCE_SHARD: '0'
          COACH_SEQUENCE_TARGETS: 'sequence-52-ally-first'
          COACH_SEQUENCE_PREFLIGHT: 'false'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell pm grant com.Coach android.permission.POST_NOTIFICATIONS
            python3 tools/verify-draft-rival-names-device.py --vi-only
            python3 tools/verify-draft-sequence-device.py
      - name: Conservar resultados de Vi en release
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-installed-vi-evidence
          path: |
            app/build/reports/spanish-device/draft-vi-instrumentation.txt
            app/build/reports/scanner-sequence/
          if-no-files-found: warn
          retention-days: 14

  targeted-native-shard:
    if: github.event_name == 'workflow_dispatch' && inputs.native_sequence_shard != '' && needs.validation-scope.outputs.run_native == 'true'
    needs: [validation-scope, catalog-preflight, shared-release-apks]
    name: Repetir únicamente el shard nativo ${{ inputs.native_sequence_shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - *fix-release-java
      - *fix-release-local-config
      - name: Recuperar los APK release compartidos
        uses: actions/download-artifact@v4
        with:
          name: fix-error-shared-release-apks
          path: app/build/outputs/apk/
      - name: Recuperar la matriz completa de una validación anterior cuando se indicó
        if: inputs.native_sequence_source_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.native_sequence_source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: scanner-multidevice-audit
          path: app/build/
      - name: Preparar el plan de secuencias del shard solicitado
        run: |
          mkdir -p app/build/generated/scanner-sequence-assets
          if [ -f app/build/reports/scanner-multidevice/audit-summary.json ]; then
            python3 tools/scanner-sequence-plan.py \
              app/build/reports/scanner-multidevice/audit-summary.json \
              app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
          else
            if [ "${{ inputs.native_sequence_shard }}" != "0" ]; then
              echo 'Para repetir un shard distinto de 0 debes indicar native_sequence_source_run.'
              exit 1
            fi
            cp app/src/test/resources/scanner/targeted-sequence-plan.json \
              app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
          fi
      - *fix-release-kvm
      - uses: ./.github/actions/prepare-emulator
      - name: Ejecutar el shard nativo solicitado
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COACH_SEQUENCE_SHARD: ${{ inputs.native_sequence_shard }}
          COACH_SEQUENCE_PREFLIGHT: 'false'
          COACH_SEQUENCE_TARGETS: ''
          COACH_SEQUENCE_BUILD_TYPE: release
          COACH_SEQUENCE_TIMEOUT_SECONDS: '4200'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/verify-draft-sequence-device.py
      - name: Conservar evidencia del shard nativo dirigido
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-native-sequence-shard-${{ inputs.native_sequence_shard }}
          path: app/build/reports/scanner-sequence/
          if-no-files-found: warn
          retention-days: 14

  cleanup-history:
    if: always()
    needs: [validation-scope, catalog-preflight, targeted-last-pick, sponsor-permissions, shared-release-apks, targeted-red-magic-release, targeted-spanish-recheck, targeted-installed-vi, targeted-native-shard]
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Keep at least 10 runs per workflow and 30 releases
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
