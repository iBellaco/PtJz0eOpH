name: Fix error de draft y catálogo

on:
  push:
    branches: [fix-error]
  workflow_dispatch:
    inputs:
      scanner_regressions:
        description: Ejecutar también las regresiones OCR instaladas (opcional y lento)
        type: boolean
        default: false

concurrency:
  group: coach-fix-error-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog-preflight:
    name: Comprobaciones previas de catálogos, idiomas y planes de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Ejecutar las mismas comprobaciones previas de validación
      run: |
        python3 -m unittest discover -s tools -p test_emulator_image.py
        python3 -m unittest discover -s tools -p test_draft_rival_device.py
        python3 -m unittest discover -s tools -p test_account_deletion_device.py
        python3 -m unittest discover -s .github/scripts -p test_localized_resources.py
        python3 .github/scripts/validate-localized-resources.py
        python3 .github/scripts/validate-patch-content.py
        python3 -m unittest discover -s .github/scripts -p test_patch_content.py
        python3 -m unittest discover -s tools -p test_draft_audit_retry.py
        python3 -m unittest discover -s tools -p test_scanner_device_report.py
        python3 -m unittest discover -s tools -p test_scanner_audit_summary.py
        python3 -m unittest discover -s tools -p test_scanner_sequence_audit.py
        python3 -m unittest discover -s tools -p test_scanner_sequence_stream.py
        python3 -m unittest discover -s tools -p test_scanner_request_coverage.py
        python3 -m unittest discover -s tools -p test_junit_failure_report.py
        python3 tools/generate-component-items.py --check
        python3 tools/import-component-icons.py --check
        python3 tools/update-champion-builds.py --check
        bash tools/audit-portuguese.sh

  targeted-last-pick:
    needs: catalog-preflight
    name: Roles, primera selección, baneos y catálogo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código de fix-error
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Preparar configuración local de pruebas
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          cp .env app/.env 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('app/google-services.json').write_text(json.dumps({
              'project_info': {'project_number': '1234567890', 'project_id': 'coach-fix-error-local'},
              'client': [{'client_info': {
                  'mobilesdk_app_id': '1:1234567890:android:0000000000000000',
                  'android_client_info': {'package_name': 'com.Coach'}},
                  'api_key': [{'current_key': 'local-targeted-ocr-test-only'}]}],
              'configuration_version': '1'
          }) + '\n')
          PY

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1


      - name: Validar recursos de los dos idiomas
        run: python3 .github/scripts/validate-localized-resources.py

      - name: Probar cambio de retrato, estabilidad, cierre y regresiones del Hub
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from importlib.machinery import SourceFileLoader
          runner = SourceFileLoader('regression', 'tools/run-jvm-regression.py').load_module()
          runner.verify([
              'com.example.DraftAutoStopTest',
              'com.example.TenthPickRegressionTest',
              'com.example.EnemyRoleInferenceTest',
              'com.example.DraftOrderUiTest',
              'com.example.DraftBanWorkerTest',
              'com.example.BannedPortraitScannerTest',
              'com.example.PortraitMatcherTest',
              'com.example.CatalogBalanceTest',
              'com.example.PortugueseGeneratedSurfaceTest',
              'com.example.RequiredItemCorrectionsTest',
              'com.example.ChampionBuildsCatalogValidationTest',
              'com.example.BuildCoachingRegressionTest',
              'com.example.DraftSlotLifecycleTest',
              'com.example.DraftSlotVisibilityTest',
              'com.example.SponsorReviewPolicyTest',
              'com.example.EconomyRequestPolicyTest',
              'com.example.RuntimeBehaviorTest',
          ])
          PY

      - name: Conservar resultados del arreglo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-draft-catalog-evidence
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/portuguese-rendered/
          if-no-files-found: warn
          retention-days: 14

      - name: Reproducir el baneo de Jhin en la captura reducida
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.example.DraftMultiDeviceAuditTest.smallCapturePreservesJhinWhenPortraitsAndBansChange' \
            --stacktrace --no-daemon --max-workers=1

      - name: Conservar la regresión de la captura reducida
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-small-capture-evidence
          path: |
            app/build/test-results/testDebugUnitTest/TEST-com.example.DraftMultiDeviceAuditTest.xml
            app/build/reports/scanner-multidevice/
          if-no-files-found: warn
          retention-days: 14

  sponsor-permissions:
    needs: catalog-preflight
    name: Aprobar y rechazar anuncios con las reglas reales
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
        working-directory: tests/firestore
      - name: Comprobar únicamente el flujo de patrocinio en emulador
        working-directory: tests/firestore
        run: npx firebase emulators:exec --only firestore --project demo-coach-tests --config ../../firebase.json 'node sponsor-review.test.mjs'

  targeted-red-magic-release:
    if: github.event_name == 'workflow_dispatch' && inputs.scanner_regressions
    needs: catalog-preflight
    name: Errores conocidos en release (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: titulos-cortos
            preflight: 'true'
            targets: 'sequence-49-enemy-first,sequence-56-ally-first,sequence-63-enemy-first'
          - suite: redmagic-secuencia-completa
            preflight: 'false'
            targets: 'sequence-0-enemy-first'
          - suite: xiaomi-secuencia-completa
            preflight: 'false'
            targets: 'sequence-42-ally-first'
          - suite: espanol-instalado
            preflight: 'false'
            targets: ''
    steps:
      - uses: actions/checkout@v5
      - &fix-release-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - &fix-release-local-config
        name: Configurar Android SDK y cliente local de prueba
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          cp .env.example .env 2>/dev/null || touch .env
          cp .env app/.env 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('app/google-services.json').write_text(json.dumps({
              'project_info': {'project_number': '1234567890', 'project_id': 'coach-fix-error-local'},
              'client': [{'client_info': {
                  'mobilesdk_app_id': '1:1234567890:android:0000000000000000',
                  'android_client_info': {'package_name': 'com.Coach'}},
                  'api_key': [{'current_key': 'local-targeted-ocr-test-only'}]}],
              'configuration_version': '1'
          }) + '\n')
          PY
      - &fix-release-gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - &fix-release-sign
        name: Crear firma efímera solo para pruebas
        env:
          COACH_ALLOW_EPHEMERAL_TEST_SIGNING: 'true'
        run: python3 .github/scripts/restore-private-signing.py
      - name: Preparar todos los casos que bloquearon la validación completa
        run: |
          mkdir -p app/build/generated/scanner-sequence-assets
          cp app/src/test/resources/scanner/targeted-sequence-plan.json \
            app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
      - &fix-release-build
        name: Compilar los dos APK release con R8
        env:
          COACH_ALLOW_EPHEMERAL_TEST_SIGNING: 'true'
          COACH_SIGNING_KEY_ALIAS: androiddebugkey
          KEYSTORE_PATH: ${{ github.workspace }}/github.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleRelease -PcoachInstrumentedBuildType=release \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            --max-workers=1 --stacktrace --no-daemon -x lint -x lintVitalRelease
          ./gradlew :app:assembleReleaseAndroidTest -PcoachInstrumentedBuildType=release \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            --max-workers=1 --stacktrace --no-daemon -x lint -x lintVitalRelease
      - &fix-release-kvm
        name: Activar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
      - uses: ./.github/actions/prepare-emulator
      - name: Reproducir Red Magic y todos los errores OCR conocidos en release
        uses: reactivecircus/android-emulator-runner@v2
        env:
          COACH_SEQUENCE_SHARD: '0'
          COACH_SEQUENCE_PREFLIGHT: ${{ matrix.preflight }}
          COACH_SEQUENCE_TARGETS: ${{ matrix.targets }}
          COACH_SEQUENCE_BUILD_TYPE: release
          COACH_ISOLATED_SUITE: ${{ matrix.suite }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            if [ "$COACH_ISOLATED_SUITE" = "espanol-instalado" ]; then for attempt in 1 2 3; do COACH_ACCOUNT_DELETION_ATTEMPT="$attempt" python3 tools/verify-account-deletion-device.py || exit 1; done; python3 tools/verify-draft-rival-names-device.py && COACH_AUDIT_LANGUAGE=es python3 tools/audit-portuguese-device.py && python3 tools/verify-overlay-history-device.py; fi
            if [ "$COACH_SEQUENCE_PREFLIGHT" = "true" ]; then python3 tools/verify-targeted-red-magic.py; fi
            /usr/bin/env bash -c 'overall_status=0; for target_case in ${COACH_SEQUENCE_TARGETS//,/ }; do if ! COACH_SEQUENCE_TARGETS="$target_case" python3 tools/verify-draft-sequence-device.py; then overall_status=1; fi; done; exit "$overall_status"'
      - name: Conservar evidencia release de todos los errores conocidos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-known-release-evidence-${{ matrix.suite }}
          path: |
            app/build/reports/scanner-sequence-preflight/
            app/build/reports/scanner-sequence/
            app/build/reports/spanish-device/
          if-no-files-found: warn
          retention-days: 14

  targeted-installed-vi:
    needs: catalog-preflight
    name: Dos retratos de Vi en APK release instalado
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - *fix-release-java
      - *fix-release-local-config
      - *fix-release-gradle
      - *fix-release-sign
      - *fix-release-build
      - *fix-release-kvm
      - uses: ./.github/actions/prepare-emulator
      - name: Comprobar únicamente las dos regresiones instaladas que fallaron
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell pm grant com.Coach android.permission.POST_NOTIFICATIONS
            python3 tools/verify-draft-rival-names-device.py --vi-only
      - name: Conservar resultados de Vi en release
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fix-error-installed-vi-evidence
          path: app/build/reports/spanish-device/draft-vi-instrumentation.txt
          if-no-files-found: warn
          retention-days: 14
