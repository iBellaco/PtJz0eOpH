name: Account deletion service
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/account-deletion
      - run: npm test
        working-directory: server/account-deletion
      - name: Authenticate the existing account service connection
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.COACH_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Verify deletion permissions without modifying accounts
        run: npm run preflight
        working-directory: server/account-deletion
      - name: Verify dedicated legal site access
        run: node server/account-deletion/ensure-legal-site.mjs
  process:
    if: github.ref == 'refs/heads/main'
    needs: verify
    concurrency:
      group: coach-account-deletion-worker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/account-deletion
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.COACH_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Install publication tools
        if: github.event_name != 'schedule'
        run: npm ci --no-audit --no-fund
        working-directory: tests/firestore
      - name: Publish public privacy and account deletion pages
        if: github.event_name != 'schedule'
        run: tests/firestore/node_modules/.bin/firebase deploy --only hosting --project wild-rift-drafting --non-interactive
      - name: Install and run trusted economy retention
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix server/economy
          node server/economy/maintenance.mjs
      - name: Process eligible requests and refresh service availability
        run: npm run process
        working-directory: server/account-deletion
  cleanup-history:
    if: always()
    needs: [verify, process]
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
