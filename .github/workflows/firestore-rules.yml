name: Support and streamer permissions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rule-test dependencies
        working-directory: tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Test permissions and concurrent publications
        working-directory: tests/firestore
        run: npm test

  cleanup-history:
    if: always()
    needs: [rules]
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Keep at most 15 completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
