name: Support and streamer permissions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_email:
        description: Verified existing owner to migrate to a signed admin claim (optional)
        required: false
        type: string
permissions:
  actions: write
  contents: read
  id-token: write
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rule-test dependencies
        working-directory: tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Test permissions and concurrent publications
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/account-deletion
      - name: Install authoritative economy
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/economy
      - name: Test permissions and account deletion integration
        working-directory: tests/firestore
        run: npm test

  deploy:
    needs: rules
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud deployment connection
        id: connection
        env:
          SERVICE_ACCOUNT: ${{ secrets.COACH_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          IDENTITY_PROVIDER: ${{ vars.COACH_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT_EMAIL: ${{ vars.COACH_FIREBASE_SERVICE_ACCOUNT_EMAIL }}
        run: |
          if [ -n "$IDENTITY_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT_EMAIL" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'method=identity' >> "$GITHUB_OUTPUT"
          elif [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'method=account' >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'method=token' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Permisos comprobados, pero no publicados: falta configurar la conexión de despliegue.'
            echo 'La publicación de permisos queda pendiente hasta configurar la conexión de despliegue.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Authenticate deployment through workload identity
        if: steps.connection.outputs.method == 'identity'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.COACH_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.COACH_FIREBASE_SERVICE_ACCOUNT_EMAIL }}
      - name: Authenticate deployment through configured account
        if: steps.connection.outputs.method == 'account'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.COACH_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        if: steps.connection.outputs.available == 'true'
        with:
          node-version: '22'
      - name: Install deployment CLI
        if: steps.connection.outputs.method == 'token'
        working-directory: tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Install verified permission publisher
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        working-directory: server/account-deletion
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install authoritative economy for deployment
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        working-directory: server/economy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve verified owner access with a signed claim
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        working-directory: server/economy
        env:
          COACH_BOOTSTRAP_ADMIN_EMAIL: ${{ inputs.bootstrap_email }}
        run: node prepare-claims.mjs
      - name: Install deployment CLI
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        working-directory: tests/firestore
        run: npm ci --no-audit --no-fund
      - name: Deploy authoritative economy before restricting clients
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        run: tests/firestore/node_modules/.bin/firebase deploy --only functions:economy --project wild-rift-drafting --non-interactive
      - name: Require the active economy and trusted administrator before changing permissions
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        working-directory: server/economy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node preflight.mjs
      - name: Publish and read back verified cloud permissions
        if: steps.connection.outputs.method == 'identity' || steps.connection.outputs.method == 'account'
        working-directory: server/account-deletion
        run: node publish-permissions.mjs
      - name: Reject legacy token-only activation
        if: steps.connection.outputs.method == 'token'
        run: |
          echo 'A verified server identity is required to migrate signed privileges and financial operations.'
          exit 1

  cleanup-history:
    if: always()
    needs: [rules, deploy]
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Keep at most 15 completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
