name: Build and Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coach-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove any legacy wrapper binaries
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat || true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Environment
        run: |
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_ROOT" ]; then
            ANDROID_ROOT="$HOME/Android/Sdk"
          fi
          # Ensure current runner user has full ownership and permissions of the Android SDK directory
          sudo chown -R $USER:$USER "$ANDROID_ROOT" 2>/dev/null || true
          chmod -R u+rwX "$ANDROID_ROOT" 2>/dev/null || true

          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          
          mkdir -p "$ANDROID_ROOT/licenses"
          mkdir -p "$HOME/.android/licenses"
          
          # Accept all standard and preview Android SDK licenses
          echo -e "\n89337d125679637817a3880e5490d21a99ab6439\n24333f8a63b1d79430e4539e1e06834d0a6e4eb3\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a256e307347618222608606e85a\n601085b94cd77f0b54ff86406955499f34350d24" | tee "$ANDROID_ROOT/licenses/android-sdk-license" > "$HOME/.android/licenses/android-sdk-license"
          echo -e "\n84831b9409646a256e307347618222608606e85a\n601085b94cd77f0b54ff86406955499f34350d24" | tee "$ANDROID_ROOT/licenses/android-sdk-preview-license" > "$HOME/.android/licenses/android-sdk-preview-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e0684d3" | tee "$ANDROID_ROOT/licenses/intel-android-extra-license" > "$HOME/.android/licenses/intel-android-extra-license"
          echo -e "\ne9acab5b5fbb560a72cfa4f69c30ed2e08dce373" | tee "$ANDROID_ROOT/licenses/mips-android-sysimage-license" > "$HOME/.android/licenses/mips-android-sysimage-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" | tee "$ANDROID_ROOT/licenses/google-gdk-license" > "$HOME/.android/licenses/google-gdk-license"

          # Find sdkmanager
          SDKMANAGER_PATH=$(find $ANDROID_ROOT/cmdline-tools -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            SDKMANAGER_PATH=$(which sdkmanager || true)
          fi
          
          if [ -n "$SDKMANAGER_PATH" ]; then
            SDK_BIN_DIR=$(dirname "$SDKMANAGER_PATH")
            echo "$SDK_BIN_DIR" >> $GITHUB_PATH
            echo "Using sdkmanager from: $SDKMANAGER_PATH"
            yes | "$SDKMANAGER_PATH" --licenses || true
            yes | "$SDKMANAGER_PATH" --channel=3 "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
            yes | "$SDKMANAGER_PATH" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
            yes | "$SDKMANAGER_PATH" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Prepare environment files
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created fallback .env"
            fi
          fi
          cp .env app/.env 2>/dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Restore persistent debug keystore
        run: |
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring persistent debug keystore from base64..."
            tr -d '\r\n ' < ./debug.keystore.base64 | base64 -d > ./debug.keystore || true
          fi
          if [ ! -s "./debug.keystore" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Wild Rift Drafting,O=Coach,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          cp ./debug.keystore ./github.keystore 2>/dev/null || true
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore 2>/dev/null || true

      - name: Create google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "500606030430",
              "project_id": "wild-rift-drafting",
              "storage_bucket": "wild-rift-drafting.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:500606030430:android:d32178b0d793e97aa7dacf",
                  "android_client_info": {
                    "package_name": "com.Coach"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDFUZjKmw2K5IJT-p6E6vBvQ9Ons6xUhck"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:500606030430:android:d32178b0d793e97aa7dacf",
                  "android_client_info": {
                    "package_name": "com.aistudio.wildriftdrafting.wrdftx"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDFUZjKmw2K5IJT-p6E6vBvQ9Ons6xUhck"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Audit Portuguese text sinks
        run: bash tools/audit-portuguese.sh

      - name: Inspect rendered Portuguese screens
        env:
          CI: "true"
        run: gradle :app:testDebugUnitTest --tests com.example.PortugueseRenderedAuditTest --tests com.example.PortugueseGeneratedSurfaceTest --tests com.example.HubChampionNavigationTest --tests com.example.SupportReportDecoderTest --tests com.example.OfflinePortugueseAuditTest --tests com.example.RuntimeBehaviorTest --tests com.example.RuntimeVisibilityTest -Proborazzi.test.record=true --stacktrace --no-daemon

      - name: Upload Portuguese screenshots and rendered texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portuguese-rendered-audit
          path: |
            app/build/reports/portuguese-rendered/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Prepare focused Portuguese evidence
        if: always()
        run: |
          python3 - <<'PYFOCUS'
          from pathlib import Path
          import shutil
          source = Path('app/build/reports/portuguese-rendered')
          target = Path('app/build/reports/portuguese-focused')
          target.mkdir(parents=True, exist_ok=True)
          for file in source.glob('*.json'):
              shutil.copy2(file, target / file.name)
          for file in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              shutil.copy2(file, target / file.name)
          names = ['creator-after-delete-pt', 'champion-guest-account-hint',
                   'champion-item-advice', 'champion-rune-advice', 'champion-spell-advice',
                   'streamer-live-animation', 'streamer-live-name-preserved', 'streamer-history', 'user-notification',
                   'premium-editor', 'premium-status', 'creator-reader',
                   'profile-admin-notifications', 'panel-notification', 'essence-plans', 'cash-redemption', 'saved-data-statistics', 'inbox-circle', 'premium-purchase', 'usdt-wallet', 'support-admin-notification']
          for file in source.glob('*.png'):
              if any(file.stem.startswith(name) for name in names):
                  shutil.copy2(file, target / file.name)
          PYFOCUS

      - name: Upload focused Portuguese evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portuguese-focused-audit
          path: app/build/reports/portuguese-focused/
          retention-days: 14

      - name: Build Debug APK
        env:
          CI: "true"
        run: |
          rm -rf app/build/outputs/apk/ || true
          gradle :app:testDebugUnitTest --tests com.example.PortraitMatcherTest --tests com.example.TenthPickRegressionTest --tests com.example.LocalizationRegressionTest --tests com.example.MetaRegionRegressionTest --tests com.example.LocalizationSurfaceTest --tests com.example.LiteRTViewerNavigationTest --tests com.example.CoachingGeneratorLocalizationTest --tests com.example.BuildElementAdviceTest --tests com.example.SupportAndStreamerPolicyTest :app:assembleDebug --stacktrace --no-daemon -x lint -x lintVitalRelease
          
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Searching for any generated apk files..."
            find app/build/outputs/ -name "*.apk" || true
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            exit 1
          fi

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Confirmed valid debug APK at: $EXPECTED_APK"
            ls -lh "$EXPECTED_APK"
          else
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            find app/build/outputs/ -name "*.apk" || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable Android virtual device acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Revisit installed APK in Portuguese
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            python3 -m unittest discover -s tools -p test_portuguese_device_audit.py
            python3 tools/audit-portuguese-device.py

      - name: Upload installed APK Portuguese evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portuguese-device-audit
          path: app/build/reports/portuguese-device/
          retention-days: 14

      - name: Extract App Version from Gradle
        id: app_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/' | tr -d '[:space:]')
          
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="${{ github.run_number }}"
          fi
          
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "App Version Name: $VERSION_NAME"
          echo "App Version Code: $VERSION_CODE"

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$ASSET_DIR"
          VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
          VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
          ASSET_NAME="Coach-v${VERSION_NAME}-build-${VERSION_CODE}-debug.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}"
          RELEASE_NAME="Coach v${{ steps.app_version.outputs.version_name }} (Build #${{ steps.app_version.outputs.version_code }})"
          
          echo "Creando release: $TAG_NAME"
          
          # Delete if it already exists to overwrite
          gh release delete "$TAG_NAME" --cleanup-tag -y 2>/dev/null || true
          
          cat << NOTE_EOF > release_notes.md
          ### Coach - APK de Pruebas (Debug)
          - **Versión de la app:** v${{ steps.app_version.outputs.version_name }}
          - **Código de versión:** ${{ steps.app_version.outputs.version_code }}
          - **Ejecución GitHub Actions:** #${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          
          Descarga el archivo APK directamente en tu teléfono Android desde los archivos adjuntos (Assets) abajo.
          NOTE_EOF
          
          # Create new release with the APK attached
          gh release create "$TAG_NAME" "${{ steps.prepare_asset.outputs.asset_path }}" \
             --title "$RELEASE_NAME" \
             --target "${{ github.sha }}" \
             --notes-file release_notes.md

  cleanup-history:
    if: always()
    needs: [build-and-release]
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Keep at most 15 completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
