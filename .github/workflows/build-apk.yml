name: Build and Release APK
concurrency:
  group: coach-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: write
  contents: write
  packages: write
jobs:
  find-validated-apk:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.validated.outputs.run_id }}
      source_sha: ${{ steps.validated.outputs.source_sha }}
    steps:
    - uses: actions/checkout@v5
    - name: Validate production version is newer than the last release
      if: github.ref == 'refs/heads/main'
      run: |
        git fetch --tags --force origin
        python3 -m unittest discover -s .github/scripts -p test_validate_version_bump.py
        python3 .github/scripts/validate-version-bump.py
    - name: Check validated APK reuse policy
      run: python3 -m unittest discover -s .github/scripts -p test_validated_apk.py
    - name: Find a fully validated APK with identical source files
      id: validated
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 .github/scripts/find-validated-apk.py
    - name: Check access to the persistent signing identity
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COACH_DEBUG_KEYSTORE_BASE64: ${{ secrets.COACH_DEBUG_KEYSTORE_BASE64 }}
        COACH_SIGNING_CERT_SHA256: ${{ vars.COACH_SIGNING_CERT_SHA256 }}
        COACH_REQUIRE_PERSISTENT_SIGNING: 'true'
      run: python3 .github/scripts/restore-private-signing.py --check-access
  catalog-validation:
    needs: find-validated-apk
    if: needs.find-validated-apk.outputs.run_id == ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check generated catalogs and Portuguese text before Android validation
      run: |
        python3 .github/scripts/validate-patch-content.py
        python3 -m unittest discover -s .github/scripts -p test_patch_content.py
        python3 -m unittest discover -s tools -p test_draft_audit_retry.py
        python3 -m unittest discover -s tools -p test_scanner_device_report.py
        python3 -m unittest discover -s tools -p test_scanner_audit_summary.py
        python3 -m unittest discover -s tools -p test_scanner_sequence_audit.py
        python3 -m unittest discover -s tools -p test_scanner_sequence_stream.py
        python3 -m unittest discover -s tools -p test_scanner_request_coverage.py
        python3 -m unittest discover -s tools -p test_junit_failure_report.py
        python3 tools/generate-component-items.py --check
        python3 tools/import-component-icons.py --check
        python3 tools/update-champion-builds.py --check
        bash tools/audit-portuguese.sh
  build-apk:
    # Build on a separate runner while the full regression suite continues.
    # Publication below still requires the suite and every installed APK audit.
    needs: [find-validated-apk, catalog-validation, security-auth-tests, scanner-tests]
    if: needs.find-validated-apk.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - &id001
      name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Validate signing publication policy
      run: |
        python3 -m unittest discover -s .github/scripts -p 'test_*signing.py'
        python3 -m unittest discover -s .github/scripts -p test_release_obfuscation.py
        python3 -m unittest discover -s .github/scripts -p test_workflow_failure_report.py
    - name: Check publication signing configuration
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COACH_DEBUG_KEYSTORE_BASE64: ${{ secrets.COACH_DEBUG_KEYSTORE_BASE64 }}
        COACH_SIGNING_CERT_SHA256: ${{ vars.COACH_SIGNING_CERT_SHA256 }}
        COACH_REQUIRE_PERSISTENT_SIGNING: 'true'
      run: python3 .github/scripts/restore-private-signing.py --check-access
    - name: Validate the committed Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - &id002
      name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - &id006
      name: Configure Android SDK Environment
      run: |
        SDK_ROOT="/usr/local/lib/android/sdk"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
    - &id003
      name: Prepare environment files
      run: |
        if [ ! -f ".env" ]; then
          if [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          else
            touch .env
            echo "Created fallback .env"
          fi
        fi
        cp .env app/.env 2>/dev/null || true
    - &id004
      name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1
        cache-disabled: false
        cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    - name: Restore persistent debug keystore
      id: signing
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COACH_DEBUG_KEYSTORE_BASE64: ${{ secrets.COACH_DEBUG_KEYSTORE_BASE64 }}
        COACH_SIGNING_CERT_SHA256: ${{ vars.COACH_SIGNING_CERT_SHA256 }}
        COACH_REQUIRE_PERSISTENT_SIGNING: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
        COACH_ALLOW_EPHEMERAL_TEST_SIGNING: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'true' || 'false' }}
      run: python3 .github/scripts/restore-private-signing.py
    - name: Verify restored signing file
      run: |
        test -s "$GITHUB_WORKSPACE/github.keystore" || {
          echo "ERROR: no se restauró el keystore persistente en $GITHUB_WORKSPACE/github.keystore"
          exit 1
        }
        ls -l "$GITHUB_WORKSPACE/github.keystore"
    - &id005
      name: Restore Android client configuration from Actions Secrets
      env:
        COACH_GOOGLE_SERVICES_JSON: ${{ secrets.COACH_GOOGLE_SERVICES_JSON }}
      run: |
        python3 -m unittest discover -s .github/scripts -p test_google_services.py
        python3 .github/scripts/restore-google-services.py
    - name: Download the measured scanner matrix for native sequence tests
      uses: actions/download-artifact@v4
      with:
        name: scanner-multidevice-audit
        path: app/build/
    - name: Prepare the complete native OCR sequence plan
      run: python3 tools/scanner-sequence-plan.py app/build/reports/scanner-multidevice/audit-summary.json app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
    - name: Build obfuscated release APK
      env:
        CI: 'true'
        # Test-only signing is explicit and limited to non-main runs. The
        # main branch remains strictly dependent on the configured production
        # signing identity and never uses a debug fallback.
        COACH_ALLOW_EPHEMERAL_TEST_SIGNING: ${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}
        COACH_SIGNING_KEY_ALIAS: androiddebugkey
        KEYSTORE_PATH: ${{ github.workspace }}/github.keystore
        STORE_PASSWORD: android
        KEY_PASSWORD: android
      run: |
        rm -rf app/build/outputs/apk/ || true

        # Build the production APK first. Packaging the release APK and the
        # instrumented APK in one Gradle invocation can retain both R8 graphs
        # and exhaust the GitHub runner heap inside ApkFlinger.
        ./gradlew :app:assembleRelease \
          -PcoachInstrumentedBuildType=release \
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
          --max-workers=1 --stacktrace --no-daemon -x lint -x lintVitalRelease

        EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$EXPECTED_APK" ]; then
          echo "Searching for any generated apk files..."
          find app/build/outputs/ -name "*.apk" || true
          echo "ERROR: Expected APK not found at $EXPECTED_APK"
          exit 1
        fi

        # Build the instrumented release APK only after the production APK is
        # safely packaged, in a fresh Gradle JVM with the same bounded worker
        # count. This prevents packageRelease from competing for heap.
        ./gradlew :app:assembleReleaseAndroidTest \
          -PcoachInstrumentedBuildType=release \
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
          --max-workers=1 --stacktrace --no-daemon -x lint -x lintVitalRelease
    - name: Verify APK
      env:
        COACH_EXPECTED_APK_CERT: ${{ steps.signing.outputs.certificate_sha256 }}
      run: |
        EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
        if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
          echo "Confirmed valid obfuscated release APK at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"
        else
          echo "ERROR: Expected APK not found at $EXPECTED_APK"
          find app/build/outputs/ -name "*.apk" || true
          exit 1
        fi
        python3 .github/scripts/verify-release-obfuscation.py --build
        python3 .github/scripts/verify-apk-signing.py
    - name: Upload obfuscated release APK artifact
      uses: actions/upload-artifact@v5
      with:
        name: app-release.apk
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/release/coach-apk-provenance.json
          app/build/outputs/apk/release/coach-obfuscation-proof.json
        if-no-files-found: error
        retention-days: 14
    - name: Upload APKs for the parallel device audit
      uses: actions/upload-artifact@v5
      with:
        name: installed-audit-apks
        path: app/build/outputs/apk/
        if-no-files-found: error
        retention-days: 3
    - name: Extract App Version from Gradle
      id: app_version
      run: |
        VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
        VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/' | tr -d '[:space:]')

        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="1.0"
        fi
        if [ -z "$VERSION_CODE" ]; then
          VERSION_CODE="${{ github.run_number }}"
        fi

        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "App Version Name: $VERSION_NAME"
        echo "App Version Code: $VERSION_CODE"
    - name: Prepare APK release asset
      id: prepare_asset
      run: |
        ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
        mkdir -p "$ASSET_DIR"
        VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
        VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
        ASSET_NAME="Coach-v${VERSION_NAME}-build-${VERSION_CODE}-obfuscated.apk"
        ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
        cp app/build/outputs/apk/release/app-release.apk "$ASSET_PATH"
        echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
        echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
        echo 'La revisión temprana no se publicó. Los artefactos firmados siguen disponibles para las pruebas del APK instalado.' >> "$GITHUB_STEP_SUMMARY"
  core-and-rendered:
    needs: [find-validated-apk, security-auth-tests]
    if: needs.find-validated-apk.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - name: Check Android lint
      env:
        CI: 'true'
      run: |
        ./gradlew :app:lintDebug --max-workers=1 --stacktrace --no-daemon || {
          grep -F 'Error:' app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          exit 1
        }
    - name: Upload Android lint report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: android-lint-audit
        path: app/build/reports/lint-results-debug.html
        retention-days: 14
    - name: Run the complete Android unit test suite
      env:
        CI: 'true'
      run: ./gradlew :app:testDebugUnitTest --fail-fast --max-workers=1 --stacktrace --no-daemon
    - name: Upload core regression results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: core-regression-audit
        path: app/build/test-results/testDebugUnitTest/TEST-*.xml
        retention-days: 14
    - name: Inspect rendered Portuguese screens
      env:
        CI: 'true'
      run: ./gradlew :app:testDebugUnitTest --rerun --tests com.example.PortugueseRenderedAuditTest --tests com.example.PortugueseGeneratedSurfaceTest --tests
        com.example.HubChampionNavigationTest --tests com.example.HistoryConsistencyRenderedTest --tests com.example.BuildCoachingRenderedTest --tests com.example.SpellCatalogRenderedTest --tests com.example.SupportReportDecoderTest --tests com.example.OfflinePortugueseAuditTest --tests
        com.example.RuntimeBehaviorTest --tests com.example.RuntimeVisibilityTest --tests com.example.DraftChampionSelectionTest --tests com.example.RequiredItemCorrectionsTest --tests com.example.ComponentItemsCatalogTest --tests com.example.AccountDeletionRenderedTest
        -Proborazzi.test.record=true --stacktrace --no-daemon
    - name: Publish failing Android cases without private data
      if: failure()
      run: python3 -c "import runpy; runpy.run_path('tools/run-jvm-regression.py')['report_failures']()"
    - name: Upload Portuguese screenshots and rendered texts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: portuguese-rendered-audit
        path: |
          app/build/reports/portuguese-rendered/
          app/build/test-results/testDebugUnitTest/
        retention-days: 14
    - name: Upload build coaching screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: build-coaching-audit
        path: app/build/reports/portuguese-rendered/build-coaching-*.png
        retention-days: 14
    - name: Prepare focused Portuguese evidence
      if: always()
      run: |
        python3 -m pip install --quiet Pillow
        python3 - <<'PYFOCUS'
        from pathlib import Path
        import shutil
        from PIL import Image
        source = Path('app/build/reports/portuguese-rendered')
        target = Path('app/build/reports/portuguese-focused')
        target.mkdir(parents=True, exist_ok=True)
        for file in source.glob('*.json'):
            shutil.copy2(file, target / file.name)
        for file in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
            shutil.copy2(file, target / file.name)
        names = ['profile-admin-expiring-roles', 'profile-admin-secondary-frame', 'profile-admin-image-frame', 'history-consistency', 'overlay-history', 'draft-narrow', 'draft-random', 'champion-situational-boot', 'champion-premium', 'champion-guest', 'champion-registered', 'component-catalog', 'component-item-tear_of_the_goddess', 'component-item-quicksilver_sash', 'component-item-bramble_vest', 'component-item-mejais_soulstealer', 'sponsor-layout', 'sponsor-read', 'managed-user', 'history-circle', 'history-receipts', 'redemption-entry', 'premium-plans-overview', 'creator-after-delete-pt', 'champion-guest-account-hint',
                 'champion-item-advice', 'champion-rune-advice', 'champion-spell-advice',
                 'streamer-live-animation', 'streamer-live-name-preserved', 'streamer-history', 'user-notification',
                 'premium-editor', 'premium-status', 'creator-reader',
                 'profile-admin-notifications', 'panel-notification', 'essence-plans', 'cash-redemption', 'saved-data-statistics', 'storage-summary', 'matchup', 'inbox-circle', 'premium-purchase', 'usdt-wallet', 'support-admin-notification', 'required-item-mercurial_scimitar', 'required-item-fiendhunter_bolts', 'required-item-kraken_slayer', 'required-item-nashor_s_tooth', 'required-item-imperial_mandate', 'required-item-terminus', 'required-item-yordle_trap', 'required-item-rabadon_s_deathcap']
        for file in source.glob('*.png'):
            if any(file.stem.startswith(name) for name in names):
                with Image.open(file) as picture:
                    if picture.height > 2400:
                        picture.thumbnail((640, 4096))
                        picture.save(target / file.name, optimize=True)
                    else:
                        shutil.copy2(file, target / file.name)
        PYFOCUS
    - name: Upload focused Portuguese evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: portuguese-focused-audit
        path: app/build/reports/portuguese-focused/
        retention-days: 14
  security-auth-tests:
    needs: [find-validated-apk, catalog-validation]
    if: needs.find-validated-apk.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - name: Validate the committed Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install isolated service test dependencies
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --prefix server/economy
        npm ci --ignore-scripts --no-audit --no-fund --prefix server/account-deletion
        npm ci --ignore-scripts --no-audit --no-fund --prefix tests/firestore
    - name: Test authoritative economy and account lifecycle
      run: |
        npm test --prefix server/economy
        npm test --prefix server/account-deletion
    - name: Test cloud permissions and transactional economy in isolated emulators
      run: npm test --prefix tests/firestore
    - name: Upload required data-test reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: security-auth-tests
        path: |
          app/build/test-results/testDebugUnitTest/TEST-*.xml
          app/build/reports/recovery/
        retention-days: 14
  scanner-tests:
    needs: [find-validated-apk, catalog-validation]
    if: needs.find-validated-apk.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - name: Validate the committed Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Recheck formerly drifting portrait centers first
      env:
        CI: 'true'
      run: ./gradlew :app:testDebugUnitTest --rerun --tests com.example.DraftMultiDeviceAuditTest.formerlyFailingCentersStayAlignedWhenPortraitsChange --tests com.example.DraftNameAtlasTest --tests com.example.AllyDraftNameReaderTest --tests com.example.CompletedFrameStabilityTest --max-workers=1 --stacktrace --no-daemon
    - name: Test scanner and matchup rules with offline fixtures
      env:
        CI: 'true'
      run: |
        python3 test_matchup_rules.py
        python3 test_scraper.py
    - name: Audit real reference slots and bans across capture profiles
      env:
        CI: 'true'
      run: ./gradlew :app:testDebugUnitTest --rerun --tests com.example.DraftMultiDeviceAuditTest --tests com.example.DraftReferenceFrameTest --tests com.example.DraftRingAlignmentTest --tests com.example.CaptureCoordinateSpaceTest --tests com.example.BannedPortraitScannerTest --max-workers=1 --stacktrace --no-daemon
    - name: Distinguish simulated scanner results from physical device verification
      run: |
        python3 tools/scanner-audit-summary.py app/build/reports/scanner-multidevice
        python3 tools/scanner-request-coverage.py app/build/reports/scanner-multidevice
    - name: Retain measured scanner coordinates and visual evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-multidevice-audit
        path: |
          app/build/reports/scanner-multidevice/
          app/build/test-results/testDebugUnitTest/TEST-*.xml
        if-no-files-found: error
        retention-days: 14
  installed-audit:
    needs:
    - build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - *id001
    - *id002
    - *id006
    - name: Download APKs for installed verification
      uses: actions/download-artifact@v4
      with:
        name: installed-audit-apks
        path: app/build/outputs/apk/
    - name: Enable Android virtual device acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo chmod 666 /dev/kvm || true
    - name: Revisit installed APK in Portuguese
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: |
          python3 -m unittest discover -s tools -p test_portuguese_device_audit.py
          python3 tools/verify-native-ocr-device.py
          python3 tools/verify-device-reinstall.py
          python3 tools/run-draft-device-audit.py
          COACH_AUDIT_LANGUAGE=pt python3 tools/audit-portuguese-device.py
    - name: Upload installed APK Portuguese evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: portuguese-device-audit
        path: |
          app/build/reports/portuguese-device/
          app/build/reports/draft-attempts/
        retention-days: 14
  installed-spanish:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - *id001
    - *id002
    - *id006
    - name: Download APKs for installed verification
      uses: actions/download-artifact@v4
      with:
        name: installed-audit-apks
        path: app/build/outputs/apk/
    - name: Enable Android virtual device acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo chmod 666 /dev/kvm || true
    - name: Revisit installed APK in Spanish and exercise overlay history
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: |
          python3 tools/verify-account-deletion-device.py
          python3 tools/verify-draft-rival-names-device.py
          COACH_AUDIT_LANGUAGE=es python3 tools/audit-portuguese-device.py
          python3 tools/verify-overlay-history-device.py
    - name: Upload installed Spanish and overlay evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: spanish-device-audit
        path: app/build/reports/spanish-device/
        retention-days: 14
  native-title-preflight:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - *id001
    - *id002
    - *id006
    - name: Download the release APKs for targeted native title verification
      uses: actions/download-artifact@v4
      with:
        name: installed-audit-apks
        path: app/build/outputs/apk/
    - name: Download the measured matrix for title verification
      uses: actions/download-artifact@v4
      with:
        name: scanner-multidevice-audit
        path: app/build/
    - name: Reconstruct the same complete native sequence plan
      run: python3 tools/scanner-sequence-plan.py app/build/reports/scanner-multidevice/audit-summary.json app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
    - name: Enable Android virtual device acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo chmod 666 /dev/kvm || true
    - name: Run the fast gate for the previously failing native cases
      timeout-minutes: 35
      uses: reactivecircus/android-emulator-runner@v2
      env:
        COACH_SEQUENCE_SHARD: '0'
        COACH_SEQUENCE_PREFLIGHT: 'true'
        COACH_SEQUENCE_TARGETS: 'sequence-4-ally-first,sequence-56-ally-first,sequence-61-enemy-first'
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: python3 tools/verify-draft-sequence-device.py
    - name: Preserve the targeted native title evidence without treating it as a full sequence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-title-preflight
        path: app/build/reports/scanner-sequence-preflight/
        if-no-files-found: error
        retention-days: 14
  native-name-sequence:
    needs: [build-apk,native-title-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - *id001
    - *id002
    - *id006
    - name: Download installed release and instrumentation APKs
      uses: actions/download-artifact@v4
      with:
        name: installed-audit-apks
        path: app/build/outputs/apk/
    - name: Download complete scanner measurements
      uses: actions/download-artifact@v4
      with:
        name: scanner-multidevice-audit
        path: app/build/
    - name: Reconstruct the exact native OCR plan
      run: python3 tools/scanner-sequence-plan.py app/build/reports/scanner-multidevice/audit-summary.json app/build/generated/scanner-sequence-assets/scanner-sequence-plan.json
    - name: Enable Android virtual device acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo chmod 666 /dev/kvm || true
    - name: Exercise sequential name OCR and tenth portrait on installed release
      uses: reactivecircus/android-emulator-runner@v2
      env:
        COACH_SEQUENCE_SHARD: ${{ matrix.shard }}
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: python3 tools/verify-draft-sequence-device.py
    - name: Preserve every native name sequence and screenshot
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-native-sequence-${{ matrix.shard }}
        path: app/build/reports/scanner-sequence/
        if-no-files-found: error
        retention-days: 14
  scanner-sequence-audit:
    needs: native-name-sequence
    if: always() && needs.native-name-sequence.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
    - *id001
    - name: Download all native sequence evidence
      uses: actions/download-artifact@v4
      with:
        pattern: scanner-native-sequence-*
        path: app/build/reports/scanner-sequence/
    - name: Download the complete source matrix
      uses: actions/download-artifact@v4
      with:
        name: scanner-multidevice-audit
        path: app/build/
    - name: Require every planned resolution and every OCR step
      env:
        COACH_NATIVE_SEQUENCE_RESULT: ${{ needs.native-name-sequence.result }}
      run: python3 tools/scanner-sequence-summary.py app/build/reports/scanner-multidevice/audit-summary.json app/build/reports/scanner-sequence/ --execution-result "$COACH_NATIVE_SEQUENCE_RESULT"
    - name: Publish the complete native sequence audit
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: scanner-sequence-complete-audit
        path: app/build/reports/scanner-sequence/
        if-no-files-found: error
        retention-days: 14
  build-and-release:
    if: always()
    needs:
    - find-validated-apk
    - security-auth-tests
    - scanner-tests
    - build-apk
    - core-and-rendered
    - installed-audit
    - installed-spanish
    - native-title-preflight
    - scanner-sequence-audit
    runs-on: ubuntu-latest
    steps:
    - name: Require all validations to pass
      env:
        DATA_RESULT: ${{ needs.security-auth-tests.result }}
        SCANNER_RESULT: ${{ needs.scanner-tests.result }}
        BUILD_RESULT: ${{ needs.build-apk.result }}
        RENDERED_RESULT: ${{ needs.core-and-rendered.result }}
        DEVICE_RESULT: ${{ needs.installed-audit.result }}
        SPANISH_RESULT: ${{ needs.installed-spanish.result }}
        SEQUENCE_RESULT: ${{ needs.scanner-sequence-audit.result }}
        PREFLIGHT_RESULT: ${{ needs.native-title-preflight.result }}
        REUSE_RUN: ${{ needs.find-validated-apk.outputs.run_id }}
        REUSE_RESULT: ${{ needs.find-validated-apk.result }}
      run: |
        python3 - <<'PYRESULT'
        import os
        results = {key: os.environ[key] for key in ('DATA_RESULT', 'SCANNER_RESULT', 'BUILD_RESULT', 'RENDERED_RESULT', 'DEVICE_RESULT', 'SPANISH_RESULT', 'SEQUENCE_RESULT','PREFLIGHT_RESULT')}
        print(results)
        expected = 'skipped' if os.environ.get('REUSE_RUN') and os.environ.get('REUSE_RESULT') == 'success' else 'success'
        if any(value != expected for value in results.values()):
            raise SystemExit('Las comprobaciones no han terminado correctamente. No se publica el APK final.')
        PYRESULT
    - *id001
    - name: Download validated APK (current run)
      if: github.ref == 'refs/heads/main' && needs.find-validated-apk.outputs.run_id == ''
      uses: actions/download-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/
    - name: Download validated APK (reused run)
      if: github.ref == 'refs/heads/main' && needs.find-validated-apk.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/
        run-id: ${{ needs.find-validated-apk.outputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - *id002
    - *id006
    - name: Verify the validated APK still carries the persistent signature
      if: github.ref == 'refs/heads/main'
      env:
        COACH_REQUIRE_APK_PROVENANCE: 'true'
      run: |
        export COACH_EXPECTED_APK_CERT=$(python3 -c 'import json; print(json.load(open(".github/coach-signing.json"))["certificate_sha256"])')
        python3 .github/scripts/verify-apk-signing.py
    - name: Extract App Version from Gradle
      id: app_version
      run: |
        VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
        VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/' | tr -d '[:space:]')

        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="1.0"
        fi
        if [ -z "$VERSION_CODE" ]; then
          VERSION_CODE="${{ github.run_number }}"
        fi

        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "App Version Name: $VERSION_NAME"
        echo "App Version Code: $VERSION_CODE"
      if: github.ref == 'refs/heads/main'
    - name: Prepare APK release asset
      id: prepare_asset
      run: |
        ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
        mkdir -p "$ASSET_DIR"
        VERSION_NAME="${{ steps.app_version.outputs.version_name }}"
        VERSION_CODE="${{ steps.app_version.outputs.version_code }}"
        ASSET_NAME="Coach-v${VERSION_NAME}-build-${VERSION_CODE}-obfuscated.apk"
        ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
        cp app/build/outputs/apk/release/app-release.apk "$ASSET_PATH"
        echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
        echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
      if: github.ref == 'refs/heads/main'
    - name: Package the validated project ZIP
      if: github.ref == 'refs/heads/main'
      id: delivery
      run: python3 .github/scripts/package-delivery.py
    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}"
        RELEASE_NAME="Coach v${{ steps.app_version.outputs.version_name }} (Build #${{ steps.app_version.outputs.version_code }})"

        echo "Creando release: $TAG_NAME"

        # Delete if it already exists to overwrite
        gh release delete "$TAG_NAME" --cleanup-tag -y 2>/dev/null || true

        cat << NOTE_EOF > release_notes.md
        ### Coach - APK ofuscado (Release)
        - **Versión de la app:** v${{ steps.app_version.outputs.version_name }}
        - **Código de versión:** ${{ steps.app_version.outputs.version_code }}
        - **Ejecución GitHub Actions:** #${{ github.run_number }}
        - **Commit:** ${{ github.sha }}

        Se publican únicamente el APK firmado y ofuscado y el ZIP del proyecto sin archivos privados.
        Esta publicación usa la nueva firma persistente autorizada desde Coach 164. No puede actualizar directamente una instalación con una firma anterior. No borres los datos ni desinstales sin conservar lo necesario. Las versiones siguientes mantendrán la nueva firma.
        NOTE_EOF

        # Create new release with the APK attached
        gh release create "$TAG_NAME" "${{ steps.prepare_asset.outputs.asset_path }}" \
           "${{ steps.delivery.outputs.project_zip }}" \
           --title "$RELEASE_NAME" \
           --target "${{ github.sha }}" \
           --notes-file release_notes.md
  cleanup-history:
    if: always()
    needs:
    - build-apk
    - core-and-rendered
    - installed-audit
    - build-and-release
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
    - name: Keep at most 30 completed runs and 30 releases
      uses: actions/github-script@v8
      with:
        script: |
          await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
  workflow-report:
    if: always()
    needs:
    - find-validated-apk
    - catalog-validation
    - security-auth-tests
    - scanner-tests
    - build-apk
    - core-and-rendered
    - installed-audit
    - installed-spanish
    - native-title-preflight
    - scanner-sequence-audit
    - build-and-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v5
    - name: Publish exact workflow failure report
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: python3 .github/scripts/workflow-failure-report.py
    - name: Retain final delivery evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: delivery-evidence
        path: app/build/reports/delivery/workflow-result.json
        retention-days: 14
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
