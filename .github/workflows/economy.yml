name: Private economy service
on:
  push:
    branches: [main]
    paths: ['server/economy/**', '.github/workflows/economy.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      review_unconfirmed:
        description: Recheck requests marked for manual review using their original IDs
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: coach-private-economy
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/economy
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.COACH_FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Process private requests with the trusted server identity
        working-directory: server/economy
        env:
          COACH_REVIEW_PENDING: ${{ inputs.review_unconfirmed || 'false' }}
        run: node worker.mjs
  cleanup-history:
    if: always()
    needs: process
    runs-on: ubuntu-latest
    concurrency:
      group: coach-actions-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/cleanup-completed-runs.cjs')({ github, context, core });
